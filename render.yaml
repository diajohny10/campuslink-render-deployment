services:
  - type: web
    name: campuslink
    runtime: node
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEACHER_PASSWORD
        sync: false
